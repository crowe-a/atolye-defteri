title: "Atölye Defteri"
description: "Karıncalar, hayvanlar ve endüstriyel yazılım üzerine kişisel bir günlük."
author: "Yiğit Çetinkaya"
email: yigitcetnkaya2@gmail.com
baseurl: "/atolye-defteri"
url: "https://crowe-a.github.io"

theme: minima
minima:
  skin: dark
  date_format: "%d %B %Y"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed

header_pages:
  - hayvanlar.md
  - muhendislik.md
  - hakkimda.md

permalink: /:year/:month/:day/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
